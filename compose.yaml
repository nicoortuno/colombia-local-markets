services:
  postgres:
    image: postgres:17
    container_name: colombia-markets-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: colombia
      POSTGRES_PASSWORD: colombia
      POSTGRES_DB: colombia_markets

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colombia -d colombia_markets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
