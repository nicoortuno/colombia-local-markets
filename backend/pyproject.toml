[project]
name = "colombia-markets-api"
version = "0.1.0"
description = "Backend API and analytics engine for Colombia Local Markets."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.54",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colombia_markets"]
